{{- if .Values.api.enabled }}
{{- $root := . -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: governor-api-config
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
  labels:
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    {{- with .Values.api.labels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  .governor.yaml: |
    admin-groups:
      - {{ .Values.api.adminGroups }}

    nats:
      url: {{ .Values.api.nats.url }}
      creds-file: {{ .Values.api.nats.credsPath }}/governor-api-nats-client-creds
      subject-prefix: {{ .Values.api.nats.subjectPrefix }}
      auth-mode: {{ .Values.api.nats.authMode }}

    {{- if .Values.api.iamRuntime.enabled }}
    iam-runtime:
      socket: {{ .Values.api.iamRuntime.socket }}
      timeout: {{ .Values.api.iamRuntime.timeout }}
    {{- end }}

    workload-identity:
      kube-service-account: {{ .Values.api.workloadIdentity.kubeServiceAccount }}
      audience: {{ .Values.api.workloadIdentity.audience }}
      subject-token-type: {{ .Values.api.workloadIdentity.subjectTokenType }}
      token-url: {{ .Values.api.workloadIdentity.tokenURL }}
      {{- if .Values.api.workloadIdentity.scopes }}
      scopes: {{- .Values.api.workloadIdentity.scopes | toYaml | nindent 8 }}
      {{- else }}
      scopes: []
      {{- end }}

    oidc:
    {{- range .Values.api.oidc }}
      - issuer:  {{ .issuer }}
        audience: {{ .audience }}
        jwksuri: {{ .jwksuri }}
        enabled: {{ .enabled }}
        {{- if or .rolesClaim .userClaim }}
        claims:
        {{- end }}
          {{- if .rolesClaim }}
          roles: {{ .rolesClaim }}
          {{- end }}
          {{- if .userClaim }}
          username: {{ .userClaim }}
          {{- end }}
        {{- if and .cedar .cedar.enabled }}
        {{- if not $root.Values.cedar.enabled }}
        {{- fail (printf "api.oidc[%s]: cedar.enabled requires top-level cedar.enabled=true (no cedar-agent sidecar would be deployed)" .issuer) }}
        {{- end }}
        cedar:
          enabled: true
          url: "http://127.0.0.1:{{ $root.Values.cedar.port }}"
          timeout: {{ .cedar.timeout | default "250ms" }}
        {{- end }}
    {{- end }}

    {{- if .Values.api.debug }}
    logging:
      debug: true
      pretty: true
    {{- end }}

    {{- if .Values.api.tracing.enabled }}
    tracing:
      enabled: true
    {{- end }}

    db:
      connections:
        max_open: {{ .Values.api.db.connections.max_open }}
        max_idle: {{ .Values.api.db.connections.max_idle }}
        max_lifetime: {{ .Values.api.db.connections.max_lifetime }}
{{- end }}
