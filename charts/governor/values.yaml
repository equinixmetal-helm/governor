# -- governor-api settings
api:
  # -- enable the governor-api components
  enabled: true

  # -- set of additional labels for the application
  labels:
    app.kubernetes.io/instance: governor
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: governor
    app.kubernetes.io/component: api

  # -- set service account name for the governor-api
  serviceAccount:
    name: default

  # -- set of additional match labels for the application
  matchLabels:
    app.kubernetes.io/instance: governor
    app.kubernetes.io/name: governor

  # -- Security context to be added to the deployment
  securityContext:
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000

  # -- set to true to turn on debug logging
  debug: false

  # -- image for the governor-api
  image:
    # -- container image repository for the governor-api image
    repository: ghcr.io/metal-toolbox/governor-api
    # -- image tag version
    tag: v0.14.0
    # -- image pull policy for the governor-api container
    pullPolicy: IfNotPresent

  # -- ingress settings for the governor-api
  ingress:
    # -- ingress class name to use for the governor-api ingress, this should match the class name of your ingress controller
    className: nginx
    # -- host definition for the api ingress
    host: api.governor.example.com
    # -- prefix use for the governor api ingress
    prefix: api.governor
    # -- additional hosts for the api ingress
    additionalHosts: []


  # -- readiness probe definitions for the governor-api pod
  readinessProbe:
    # -- interval to run the readiness probe
    periodSeconds: 20
    # -- number of seconds to wait for the probe to timeout
    timeoutSeconds: 3
    # -- minimum consecutive successes for probe to be considered successful
    successThreshold: 1
    # -- minimum consecutive failures for the probe to be considered unhealthy
    failureThreshold: 3

  # -- admin group for highest level permissions in the governor-api
  adminGroups: "governor-admins"

  # -- nats settings for the governor-api
  nats:
    # -- url to connection to nats
    url:
    # -- mount path for the nats creds file
    credsPath: /nats
    # -- subject prefix used for the nats events
    subjectPrefix: governor.events
    # -- nats secrets definitions
    secrets:
      # -- enable helm secrets, set to `true` if you want to set the value directly in the chart (not recommended)
      enabled: false
      # -- client credentials secrets
      clientCreds:
    # -- authMode is the method used to authenticate to NATS, available options are:
    #    - creds-file-only: use the NATS credentials file for authentication
    #    - workload-identity: use Kubernetes workload identity for authentication
    #    - iam-runtime: use the IAM runtime for authentication
    authMode: creds-file-only

  # -- workload identity federation
  workloadIdentity:
    # -- path to kube service account token
    kubeServiceAccount: "/var/run/secrets/tokens/service-account-token"
    subjectTokenType: "urn:ietf:params:oauth:token-type:id_token"
    tokenURL: ""
    audience: ""
    scopes: []

  # -- projected service account token settings for the `tokens` volume, shared
  #    by the workload-identity and iam-runtime auth paths (both read the token
  #    at `/var/run/secrets/tokens/service-account-token`). Set `audience` to
  #    mint the SA token with a specific `aud` claim (distinct from
  #    `workloadIdentity.audience`, which is the exchange parameter sent to
  #    `tokenURL`). Both fields are optional; when unset the SA token is minted
  #    with the API server's default audience.
  serviceAccountToken:
    audience: ""
    expirationSeconds:

  iamRuntime:
    # -- enabling IAM runtime will inject iam-runtime-infratographer configs
    #    and sidecars to the deployment
    enabled: false
    socket: unix:///var/iam-runtime/runtime.sock
    timeout: 15s

  # -- oidc settings, currently startup will fail without a valid oidc config
  oidc:
    # -- a unique identifier for your app that is issued to you when you register your app with the IdP
    - audience: ""
      issuer: ""
      jwksuri: ""
      enabled: true
      rolesClaim: ""
      userClaim: ""
      # -- optional per-provider Cedar authorization. When `cedar.enabled` is
      #    true this provider's tokens are authorized by a cedar-agent instead
      #    of by scope. `url` defaults to the in-pod sidecar
      #    (http://127.0.0.1:<cedar.port>), which requires the top-level
      #    `cedar.enabled: true`; set `url` to point at an external cedar-agent
      #    instead, in which case the sidecar is not required.
      # cedar:
      #   enabled: true
      #   timeout: 250ms
      #   url: ""

  # -- replicas of the governor-api
  replicaCount: 2
  # -- resource settings for the governor-api
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi

  # -- settings for the backend db
  db:
    connections:
      max_open: 20
      max_idle: 20
      max_lifetime: 0
    # -- db secrets, set to `true` if you want to set the value directly in the chart (not recommended)
    secrets:
      enabled: false
      uri:
      crdbCrt:
    uri:
      existingSecret: db-uri
  # -- tracing settings
  tracing:
    enabled: true
    # -- OpenTelemetry endpoint configuration
    endpoint: "http://opentelemetry-collector:4317"
    # -- whether to use insecure connection to the OTEL endpoint
    insecure: true
    # -- tracing secrets, set to `true` if you want to set the value directly in the chart (not recommended)
    secrets:
      enabled: false
      honeycombKey:

# -- slack-addon settings
slackAddon:
  # -- set to false to disable this addon completely
  enabled: true

  # -- ports for the slack addon container
  ports:
    - name: http
      containerPort: 8000

  # -- set of labels for the application
  labels:
    app.kubernetes.io/instance: gov-slack-addon
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: gov-slack-addon

  # -- set service account name for the slack addon
  serviceAccount:
    name: default

  # -- set of match labels for the application
  matchLabels:
    app.kubernetes.io/instance: gov-slack-addon
    app.kubernetes.io/name: gov-slack-addon

  # -- set to true to turn on debug logging
  debug: false
  # -- set to true for human readable logging
  pretty: false
  # -- dryrun on the reconcile loop
  dryrun: false

  # -- governor-api settings to retrieve required information by the slack addon
  api:
    url: https://api.governor.example.com
    clientId: gov-slack-addon-governor
    audience: https://api.governor.example.com

  # -- hydra settings for communication with the governor-api
  hydra:
    url: https://hydra.example.com/oauth2/token


  # -- nats setup for the slack addon
  nats:
    url: tls://nats.governor.example.com:4222,
    credsPath: /nats
    subjectPrefix: governor.events
    authMode: creds-file-only

  # -- IAM runtime settings for the slack addon
  iamRuntime:
    # -- enabling IAM runtime will inject iam-runtime-infratographer configs
    #    and sidecars to the deployment
    enabled: false
    socket: unix:///var/iam-runtime/runtime.sock
    timeout: 15s

  # -- workload identity federation settings for the slack addon
  workloadIdentityFederation:
    enabled: false
    kubeServiceAccount: "/var/run/secrets/tokens/service-account-token"
    subjectTokenType: "urn:ietf:params:oauth:token-type:id_token"
    tokenURL: ""
    audience: ""
    scopes: []

  # reconciler will run at the defined interval to ensure no events were missed
  reconciler:
    interval: 1h
    locking: true

  replicas: 1

  autoscaling:
    enabled: false

  nodeSelector:

  tolerations:

  # -- image settings for the slack addon
  image:
    repository: ghcr.io/metal-toolbox/governor-slack-addon
    tag: "463-92d597cb"
    pullPolicy: IfNotPresent

  # -- Security context to be added to the deployment
  securityContext:
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000

  service:
    port: 80

  # -- (dict) resource limits & requests
  # ref: https://kubernetes.io/docs/user-guide/compute-resources/
  resources:
    limits:
      cpu: 500m
      memory: 500Mi
    requests:
      cpu: 250m
      memory: 500Mi

# -- cedar-agent external authorization sidecar settings
cedar:
  # -- deploy the permitio/cedar-agent sidecar alongside governor-api and
  #    generate its schema/policies/data from the roles and bindings below.
  #    Enable per-provider authorization with `api.oidc[].cedar.enabled`.
  enabled: false

  # -- image settings for the cedar-agent sidecar
  image:
    # -- container image repository for cedar-agent
    repository: permitio/cedar-agent
    # -- image tag version (pin explicitly; do not use latest)
    tag: "0.2.2"
    # -- image pull policy for the cedar-agent container
    pullPolicy: IfNotPresent

  # -- port cedar-agent listens on. It binds to loopback only and is reachable
  #    by governor-api inside the pod at http://127.0.0.1:<port>
  port: 8180

  # -- cedar-agent log level (error, warn, info, debug, trace). Defaults to
  #    `warn` to suppress the per-request and route-dump logging that `info`
  #    emits; raise to `info`/`debug` for troubleshooting.
  logLevel: warn

  # -- resource settings for the cedar-agent sidecar
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

  # -- Security context to be added to the cedar-agent container
  securityContext:
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000

  # -- cedar roles, each rendered as one cedar policy. `id` is the policy id and
  #    the key referenced by bindings; `name` (defaults to `id`) is the Cedar
  #    `Role` entity id used in policies and data. Each entry in `permissions`
  #    must be `<verb>:governor:<resource>` where verb is one of
  #    create/read/update/delete and resource is one of users/groups/
  #    applications/organizations/extensions/extensionresources/notifications/
  #    events. Invalid permissions fail the render.
  roles: []
  #  - id: gov-some-addon
  #    name: gov-some-addon
  #    permissions:
  #      - read:governor:users
  #      - update:governor:users

  # -- bind JWT subjects (Workload principals) to a role by its `id`. A subject
  #    is the token `sub` claim, e.g. the WIF principal string.
  bindings: []
  #  - role: gov-some-addon
  #    subjects:
  #      - some-workload-subject

# -- audit sidecar settings
audit:
  auditImage:
    repository: ghcr.io/metal-toolbox/audittail
    tag: v0.9.0
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi
  initContainer:
    resources:
      limits:
        cpu: 100m
        memory: 20Mi
      requests:
        cpu: 100m
        memory: 20Mi
  securityContext:
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000

# -- iam-runtime sidecar settings
iam-runtime-infratographer:
  config:
    permissions:
      disable: true
    jwt:
      jwksURI: ""
      issuer: ""
    accessTokenProvider:
      enabled: false
      source:
        file:
          tokenPath: "/var/run/secrets/tokens/service-account-token"
      exchange:
        issuer: ""

  volumeMounts:
    - name: tokens
      mountPath: "/var/run/secrets/tokens"

  resources:
    limits:
      cpu: 1
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # -- Security context to be added to the deployment
  securityContext:
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
